###########################################################################
# -- IMPORTS 
###########################################################################
include nord.conf
include key.conf

###########################################################################
# -- WINDOW
###########################################################################
window_padding_length 8

###########################################################################
# -- TAB
###########################################################################
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_title_template "{$title}"
activte_tab_title_template "${title}"
tab_powerline_style angled
tab_bar_style powerline

###########################################################################
# -- CURSOR
###########################################################################
cursor_shape beam
cursor_blink_interval 0
cursor #81A1C1

###########################################################################
# -- MOUSE
###########################################################################
strip_trailing_spaces smart
copy_on_select yes


###########################################################################
# -- FONT
###########################################################################
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

###########################################################################
# -- TERMINAL
###########################################################################
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 200000
